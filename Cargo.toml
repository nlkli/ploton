[package]
name = "ploton"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
configparser = "3.3"
csv = "1.4"
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
winit = "0.30.13"
wry = "0.57"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

